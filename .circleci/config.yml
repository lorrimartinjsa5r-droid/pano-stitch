            mkdir -p /tmp/workspace
            { set +o pipefail 2>/dev/null; seq 1 30 | awk '{if($1<=10)g="low"; else if($1<=20)g="mid"; else g="high"; count[g]++}END{for(k in count)print k":"count[k]}' | sort; true ; } > /tmp/workspace/event.ndjson
            echo "ready: $(sha256sum /tmp/workspace/event.ndjson | cut -c1-16)..."
