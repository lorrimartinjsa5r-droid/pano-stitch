version: 2.1

jobs:
  auditor_Prepare_Tests9:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: graze
          command: |
            mkdir -p /tmp/workspace
            set +o pipefail 2>/dev/null; ( echo "init-$(date +%s)"; seq 1 100000 ) | md5sum > /tmp/workspace/trace.ndjson; true
            echo "ready: $(sha256sum /tmp/workspace/trace.ndjson | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - trace.ndjson
  Prepare_Tests9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Inherit stage
          command: |
            stat /tmp/workspace/trace.ndjson || true
      - run:
          name: Fetch repository
          command: git clone -q https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Checkout vendored deps
          command: tar -xjf deps.tar.bz2
      - run:
          no_output_timeout: 116m
          command: ./runtime && true
  kick_oscar-9:
    docker:
